[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2midi"
version = "0.0.0"
description = "Natural language to MIDI via LLM-generated, validated music specs"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "mido>=1.3", "anthropic>=1.4,<3", "openai>=3.8,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=42,<51"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prompt2midi.translate" = ["lexicon/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
