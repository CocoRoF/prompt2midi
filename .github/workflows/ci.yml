name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml 의 requires-python (>=3.11) 과 맞춘다. 범위를 바꾸면 여기도 고친다.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (LLM 실제 호출 없음, P2M_LIVE 미설정)
        run: python -m pytest -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python tools/scan_secrets.py
      - name: Dependency license record
        run: python tools/check_licenses.py

  docker:
    # 이미지를 빌드만 하고(push·레지스트리 로그인 없음) 컨테이너를 띄워 점검한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (push 하지 않음)
        run: docker build -t prompt2midi:ci .
      - name: Run container and assert
        run: bash tools/docker_check.sh prompt2midi:ci

  browser:
    # 헤드리스 Chromium 으로 / 와 /admin 을 점검한다(tools/browser_check.py). 외부 LLM 호출 없음.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tools/requirements-ci.txt
      - name: Install app and CI-only tools
        run: |
          python -m pip install -e .
          python -m pip install -r tools/requirements-ci.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser check
        run: python tools/browser_check.py --out out/browser
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check
          path: out/browser
          if-no-files-found: warn
