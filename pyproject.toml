[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2midi"
version = "0.0.0"
description = "Natural language to MIDI via LLM-generated, validated music specs"
requires-python = ">=3.11"
# fastapi/uvicorn 등은 API 단계에서 추가 (설계안 8절)
dependencies = ["pydantic>=2.5", "mido>=1.3", "anthropic>=1.4", "openai>=3.8"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
