[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt2midi"
version = "0.0.0"
description = "Natural language to MIDI via LLM-generated, validated music specs"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "mido>=1.3", "anthropic>=1.4", "openai>=3.8", "fastapi>=0.115", "uvicorn>=0.30", "cryptography>=42"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
